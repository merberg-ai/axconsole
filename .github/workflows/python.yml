name: Python clients and backend

on:
  push:
    paths:
      - "linux/**"
      - "windows/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "linux/**"
      - "windows/**"
      - ".github/workflows/python.yml"

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux AX.25 headers
        run: sudo apt-get update && sudo apt-get install -y libax25-dev ax25-apps ax25-tools
      - name: Install package and tests
        run: python -m pip install -U pip pytest && python -m pip install -e ./linux
      - name: Test
        run: python -m pytest -q linux/tests
      - name: Compile native helpers
        run: |
          gcc -Wall -Wextra -Werror -o /tmp/axconsole-tx-native linux/native/axconsole_tx.c -lax25
          gcc -Wall -Wextra -Werror -o /tmp/axconsole-conn-native linux/native/axconsole_conn.c -lax25

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and tests
        run: python -m pip install -U pip pytest; python -m pip install -e ./windows
      - name: Test
        run: python -m pytest -q windows/tests
